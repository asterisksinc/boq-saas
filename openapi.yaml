openapi: 3.1.0
info:
  title: BOQ Design Arena API
  version: 2.0.0
servers:
  - url: /api/v1
security:
  - supabaseCookie: []
paths:
  /auth/register:
    post:
      security: []
      summary: Register an account and default workspace
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Register' } } } }
      responses: { '201': { description: "Registered; when email confirmation is required, a 6-digit signup OTP is sent" }, '409': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /auth/login:
    post:
      security: []
      summary: Request an email OTP (creating a first-time user), verify it, or use the legacy password login
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Login' } } } }
      responses: { '200': { description: Signed in }, '401': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /auth/refresh:
    post:
      summary: Rotate and refresh the current Supabase session
      responses: { '200': { description: Refreshed }, '401': { $ref: '#/components/responses/Error' } }
  /auth/logout:
    post:
      summary: Revoke the local refresh session and clear cookies
      responses: { '200': { description: Logged out } }
  /auth/me:
    get:
      summary: Auth identity, active workspace, membership, permissions, and onboarding
      responses: { '200': { description: Current context }, '401': { $ref: '#/components/responses/Error' } }
  /auth/forgot-password:
    post:
      security: []
      summary: Send a non-enumerating Supabase recovery email
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Email' } } } }
      responses: { '200': { description: Generic accepted response }, '429': { $ref: '#/components/responses/Error' } }
  /auth/reset-password:
    post:
      security: []
      summary: Exchange a one-time PKCE recovery code and set a new password
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [code, password], properties: { code: { type: string }, password: { type: string, minLength: 10, maxLength: 128 } } } } } }
      responses: { '200': { description: Password reset }, '400': { $ref: '#/components/responses/Error' } }
  /auth/verify-email:
    get:
      security: []
      summary: Verify a Supabase PKCE code or email-link token hash
      parameters:
        - { in: query, name: code, required: false, description: PKCE code returned to the configured verification redirect, schema: { type: string } }
        - { in: query, name: token_hash, required: false, description: Token hash used by a custom email template, schema: { type: string } }
        - { in: query, name: type, required: false, schema: { type: string, enum: [email, signup, email_change] } }
      responses: { '200': { description: Verified }, '400': { $ref: '#/components/responses/Error' } }
    post:
      security: []
      summary: Verify a custom email OTP or Supabase email token from JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, additionalProperties: false, required: [email, otp], properties: { email: { type: string, format: email }, otp: { type: string, pattern: '^\\d{6}$' } } }
                - { type: object, additionalProperties: false, required: [tokenHash, type], properties: { tokenHash: { type: string }, type: { type: string, enum: [email, signup, email_change] } } }
      responses: { '200': { description: Verified }, '400': { $ref: '#/components/responses/Error' } }
  /auth/resend-verification:
    post:
      security: []
      summary: Resend signup verification without account enumeration
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Email' } } } }
      responses: { '200': { description: Generic accepted response } }
  /users/me:
    get:
      summary: Get the current user and workspace context
      responses: { '200': { description: Current user } }
    patch:
      summary: Update allowlisted user profile fields
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { displayName: { type: [string, 'null'], maxLength: 120 } } } } } }
      responses: { '200': { description: Updated }, '400': { $ref: '#/components/responses/Error' } }
  /users/me/password:
    patch:
      summary: Change password after verifying the current password
      responses: { '200': { description: Changed }, '401': { $ref: '#/components/responses/Error' } }
  /users/me/preferences:
    get:
      summary: Read timezone and locale preferences
      responses: { '200': { description: Preferences } }
    patch:
      summary: Update allowlisted timezone and locale preferences
      responses: { '200': { description: Updated }, '400': { $ref: '#/components/responses/Error' } }
  /onboarding/me:
    get:
      summary: Read resumable onboarding state
      responses: { '200': { description: Onboarding state } }
    patch:
      summary: Atomically update progress and supported company settings
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingPatch' } } } }
      responses: { '200': { description: Updated }, '403': { $ref: '#/components/responses/Error' } }
  /dashboard/overview:
    get:
      summary: Permission-aware workspace dashboard overview with temporary demo Project/BOQ widgets
      parameters:
        - { in: query, name: period, schema: { type: string, enum: [week, month, quarter], default: month } }
      responses:
        '200': { description: Overview; temporary sections are identified by dataSource=hardcoded_demo and demoData=true, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /dashboard/recent-projects: { get: { summary: Paginated temporary demo recent projects, responses: { '200': { $ref: '#/components/responses/Page' } } } }
  /dashboard/recent-boqs: { get: { summary: Paginated temporary demo recent BOQs, responses: { '200': { $ref: '#/components/responses/Page' } } } }
  /dashboard/pending-actions: { get: { summary: Paginated temporary demo pending actions, responses: { '200': { $ref: '#/components/responses/Page' } } } }
  /dashboard/upcoming-deliverables: { get: { summary: Paginated temporary demo deliverables, responses: { '200': { $ref: '#/components/responses/Page' } } } }
  /dashboard/notifications: { get: { summary: Paginated user notifications, responses: { '200': { $ref: '#/components/responses/Page' } } } }
  /projects:
    get:
      summary: List projects in the authenticated user's active workspace
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { in: query, name: search, schema: { type: string, maxLength: 120 } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/ProjectStatus' } }
        - { in: query, name: type, schema: { type: string, maxLength: 80 } }
        - { in: query, name: assignedToMe, schema: { type: boolean } }
      responses: { '200': { $ref: '#/components/responses/Page' }, '401': { $ref: '#/components/responses/Error' } }
    post:
      summary: Create a project in the active workspace
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectCreate' } } } }
      responses: { '201': { description: Project created }, '400': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /projects/{projectId}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get: { summary: Get a project and its rooms, responses: { '200': { description: Project detail }, '404': { $ref: '#/components/responses/Error' } } }
    patch:
      summary: Update allowlisted project fields
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectPatch' } } } }
      responses: { '200': { description: Project updated }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
    delete: { summary: Permanently delete a project and its owned rooms (owner/admin), responses: { '200': { description: Deleted }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
  /projects/{projectId}/status:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      summary: Change project lifecycle status
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], additionalProperties: false, properties: { status: { $ref: '#/components/schemas/ProjectStatus' } } } } } }
      responses: { '200': { description: Status changed }, '404': { $ref: '#/components/responses/Error' } }
  /projects/{projectId}/duplicate:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post: { summary: Duplicate project details and rooms as a planning project, responses: { '201': { description: Project duplicated }, '404': { $ref: '#/components/responses/Error' } } }
  /projects/{projectId}/rooms:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get: { summary: List project rooms, responses: { '200': { description: Room list } } }
    post:
      summary: Add a room to a project
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectRoom' } } } }
      responses: { '201': { description: Room created }, '409': { $ref: '#/components/responses/Error' } }
  /projects/{projectId}/rooms/{roomId}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/RoomId' }]
    patch:
      summary: Update a project room
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectRoom' } } } }
      responses: { '200': { description: Room updated }, '404': { $ref: '#/components/responses/Error' } }
    delete: { summary: Delete a project room, responses: { '200': { description: Room deleted }, '404': { $ref: '#/components/responses/Error' } } }
  /projects/import-template:
    get: { summary: Download the canonical project Excel import template, responses: { '200': { description: XLSX template, content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {} } } } }
  /projects/imports/preview:
    post:
      summary: Parse and validate a project spreadsheet without writing data
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/ProjectImportUpload' } } } }
      responses: { '200': { description: Up to 100 preview rows plus validation results }, '400': { $ref: '#/components/responses/Error' }, '413': { $ref: '#/components/responses/Error' } }
  /projects/imports:
    get: { summary: List project import history, responses: { '200': { $ref: '#/components/responses/Page' } } }
    post:
      summary: Parse, validate, and atomically import projects from CSV/XLS/XLSX
      parameters: [{ in: query, name: skipInvalid, schema: { type: boolean, default: false } }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/ProjectImportUpload' } } } }
      responses: { '201': { description: Import completed }, '422': { $ref: '#/components/responses/Error' }, '413': { $ref: '#/components/responses/Error' } }
  /boq-imports/preview:
    post:
      summary: Parse a BOQ CSV/XLS/XLSX on the backend without writing it
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/BoqImportUpload' } } } }
      responses: { '200': { description: "Columns, row count, and up to 100 preview rows" }, '400': { $ref: '#/components/responses/Error' }, '413': { $ref: '#/components/responses/Error' } }
  /boq-imports/upload:
    post:
      summary: Parse and persist a BOQ CSV/XLS/XLSX on the backend
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/BoqImportUpload' } } } }
      responses: { '201': { description: BOQ import saved }, '400': { $ref: '#/components/responses/Error' }, '413': { $ref: '#/components/responses/Error' } }
  /boqs:
    get:
      summary: List workspace BOQs with calculated room/item counts and totals
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: projectId, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [draft, in_review, approved] } }
      responses: { '200': { $ref: '#/components/responses/Page' } }
    post:
      summary: Create a blank BOQ or instantiate one from a template
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [boqNumber, projectId], properties: { boqNumber: { type: string }, projectId: { type: string, format: uuid }, version: { type: string }, assignedTo: { type: [string, 'null'], format: uuid }, method: { type: string, enum: [blank, template] }, templateId: { type: [string, 'null'], format: uuid }, markupPercent: { type: number }, taxPercent: { type: number } } } } } }
      responses: { '201': { description: BOQ created }, '409': { $ref: '#/components/responses/Error' } }
  /boqs/{boqId}:
    parameters: [{ in: path, name: boqId, required: true, schema: { type: string, format: uuid } }]
    get: { summary: Get the complete BOQ room/category/item tree and server totals, responses: { '200': { description: BOQ detail }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { summary: Update BOQ version assignment markup or tax, responses: { '200': { description: Updated } } }
  /boqs/{boqId}/status:
    parameters: [{ in: path, name: boqId, required: true, schema: { type: string, format: uuid } }]
    post: { summary: Change BOQ lifecycle status; approve/archive requires owner or admin, responses: { '200': { description: Status changed } } }
  /boqs/{boqId}/duplicate:
    parameters: [{ in: path, name: boqId, required: true, schema: { type: string, format: uuid } }]
    post: { summary: Deep-copy a BOQ and its complete hierarchy, responses: { '201': { description: Duplicated } } }
  /boqs/{boqId}/rooms:
    parameters: [{ in: path, name: boqId, required: true, schema: { type: string, format: uuid } }]
    post: { summary: Add a BOQ room, responses: { '201': { description: Room created } } }
  /boqs/{boqId}/rooms/{roomId}:
    parameters: [{ in: path, name: boqId, required: true, schema: { type: string, format: uuid } }, { in: path, name: roomId, required: true, schema: { type: string, format: uuid } }]
    patch: { summary: Update a BOQ room, responses: { '200': { description: Updated } } }
    delete: { summary: Delete a BOQ room and descendants (owner/admin), responses: { '200': { description: Deleted } } }
  /boqs/{boqId}/rooms/{roomId}/categories:
    parameters: [{ in: path, name: boqId, required: true, schema: { type: string, format: uuid } }, { in: path, name: roomId, required: true, schema: { type: string, format: uuid } }]
    post: { summary: Add a category to a BOQ room, responses: { '201': { description: Category created } } }
  /boqs/{boqId}/categories/{categoryId}:
    parameters: [{ in: path, name: boqId, required: true, schema: { type: string, format: uuid } }, { in: path, name: categoryId, required: true, schema: { type: string, format: uuid } }]
    patch: { summary: Update a BOQ category, responses: { '200': { description: Updated } } }
    delete: { summary: Delete a BOQ category and items (owner/admin), responses: { '200': { description: Deleted } } }
  /boqs/{boqId}/categories/{categoryId}/items:
    parameters: [{ in: path, name: boqId, required: true, schema: { type: string, format: uuid } }, { in: path, name: categoryId, required: true, schema: { type: string, format: uuid } }]
    post: { summary: Add an item; amount is generated server-side, responses: { '201': { description: Item created } } }
  /boqs/{boqId}/items/{itemId}:
    parameters: [{ in: path, name: boqId, required: true, schema: { type: string, format: uuid } }, { in: path, name: itemId, required: true, schema: { type: string, format: uuid } }]
    patch: { summary: Update allowlisted BOQ item inputs, responses: { '200': { description: Updated } } }
    delete: { summary: Delete a BOQ item (owner/admin), responses: { '200': { description: Deleted } } }
  /boq-templates:
    get: { summary: List reusable BOQ templates ordered by use count, responses: { '200': { $ref: '#/components/responses/Page' } } }
    post: { summary: Save an existing BOQ hierarchy as a template, responses: { '201': { description: Template created } } }
  /costing/categories:
    get: { summary: Paginated costing category tree source with counts, responses: { '200': { $ref: '#/components/responses/Page' } } }
    post: { summary: Create a costing category or sub-category, responses: { '201': { description: Created } } }
  /costing/categories/{categoryId}:
    parameters: [{ in: path, name: categoryId, required: true, schema: { type: string, format: uuid } }]
    get: { summary: Category detail with defaults sub-categories and items, responses: { '200': { description: Detail } } }
    patch: { summary: Update category defaults, responses: { '200': { description: Updated } } }
    delete: { summary: Delete an unused category (owner/admin), responses: { '200': { description: Deleted } } }
  /costing/items:
    get: { summary: Paginated costing library items with calculated margins, responses: { '200': { $ref: '#/components/responses/Page' } } }
    post: { summary: Add a costing library item, responses: { '201': { description: Created } } }
  /costing/items/{itemId}:
    parameters: [{ in: path, name: itemId, required: true, schema: { type: string, format: uuid } }]
    get: { summary: Item detail and vendor quotes, responses: { '200': { description: Detail } } }
    patch: { summary: Update a costing item, responses: { '200': { description: Updated } } }
    delete: { summary: Archive a costing item (owner/admin), responses: { '200': { description: Archived } } }
  /costing/vendor-quotes:
    post: { summary: Add a vendor quote for an item, responses: { '201': { description: Created } } }
  /costing/vendor-quotes/{quoteId}/selection:
    parameters: [{ in: path, name: quoteId, required: true, schema: { type: string, format: uuid } }]
    post: { summary: Atomically select or clear a preferred quote, responses: { '200': { description: Selection saved } } }
  /costing/scenarios:
    get: { summary: Paginated costing scenarios, responses: { '200': { $ref: '#/components/responses/Page' } } }
    post: { summary: Create a BOQ costing scenario, responses: { '201': { description: Created } } }
  /costing/scenarios/{scenarioId}:
    parameters: [{ in: path, name: scenarioId, required: true, schema: { type: string, format: uuid } }]
    get: { summary: Scenario and derived savings, responses: { '200': { description: Detail } } }
    patch: { summary: Update a scenario, responses: { '200': { description: Updated } } }
  /costing/scenarios/{scenarioId}/duplicate:
    parameters: [{ in: path, name: scenarioId, required: true, schema: { type: string, format: uuid } }]
    post: { summary: Duplicate a scenario, responses: { '201': { description: Duplicated } } }
  /costing/analysis:
    get: { summary: Real workspace budget actual committed forecast variance and vendor data, responses: { '200': { description: Cost analysis } } }
  /costing/margins:
    get: { summary: Current/target margins category breakdown and low-margin items, responses: { '200': { description: Margin analysis } } }
  /costing/settings:
    get: { summary: Costing configuration health and available settings sections, responses: { '200': { description: Settings overview } } }
  /reports/analytics:
    get:
      summary: Administrator-only business analytics derived from workspace projects BOQs invoices and costs
      parameters: [{ in: query, name: period, schema: { type: string, enum: [month, quarter, year], default: year } }]
      responses: { '200': { description: Reports and analytics payload }, '403': { $ref: '#/components/responses/Error' } }
  /reports/analytics/pdf:
    get: { summary: Download the administrator analytics summary as PDF, responses: { '200': { description: Analytics PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }, '403': { $ref: '#/components/responses/Error' } } }
  /proposals:
    get:
      summary: List active workspace proposals
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/ProposalStatus' } }
        - { in: query, name: search, schema: { type: string, maxLength: 120 } }
      responses: { '200': { $ref: '#/components/responses/Page' }, '401': { $ref: '#/components/responses/Error' } }
    post:
      summary: Create a proposal from scratch, BOQ, duplicate, or template
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProposalCreate' } } } }
      responses: { '201': { description: Proposal created }, '400': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /proposals/summary:
    get:
      summary: Proposal dashboard totals, win rate, average value, and pending responses
      responses: { '200': { description: Proposal summary } }
  /proposals/{proposalId}:
    parameters:
      - { $ref: '#/components/parameters/ProposalId' }
    get:
      summary: Get proposal details/preview data
      responses: { '200': { description: Proposal }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      summary: Update editable proposal details
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProposalPatch' } } } }
      responses: { '200': { description: Updated }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
    delete:
      summary: Archive a proposal (owner/admin)
      responses: { '200': { description: Archived }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /proposals/{proposalId}/status:
    parameters:
      - { $ref: '#/components/parameters/ProposalId' }
    post:
      summary: Send a proposal or mark it approved, in revision, won, lost, or draft
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [status], properties: { status: { $ref: '#/components/schemas/ProposalStatus' } } } } } }
      responses: { '200': { description: Status changed }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /proposals/{proposalId}/pdf:
    parameters:
      - { $ref: '#/components/parameters/ProposalId' }
    get:
      summary: Download a generated one-page proposal PDF
      responses:
        '200': { description: Proposal PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Error' }
  /proposals/{proposalId}/view:
    parameters:
      - { $ref: '#/components/parameters/ProposalId' }
    post:
      summary: Atomically record an authenticated proposal preview/view
      responses: { '200': { description: Updated view count }, '404': { $ref: '#/components/responses/Error' } }
  /document-folders:
    get:
      summary: List root folders or direct children with item count and size
      parameters:
        - { in: query, name: parentId, schema: { type: string, format: uuid } }
      responses: { '200': { description: Folder list } }
    post:
      summary: Create a folder
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FolderCreate' } } } }
      responses: { '201': { description: Folder created }, '409': { $ref: '#/components/responses/Error' } }
  /document-folders/{folderId}:
    parameters:
      - { $ref: '#/components/parameters/FolderId' }
    patch:
      summary: Rename or move a folder
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FolderPatch' } } } }
      responses: { '200': { description: Folder updated }, '409': { $ref: '#/components/responses/Error' } }
    delete:
      summary: Permanently delete a folder tree and stored files (owner/admin)
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [confirmation], properties: { confirmation: { type: string, description: Exact folder name } } } } } }
      responses: { '200': { description: Folder tree deleted }, '400': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /documents:
    get:
      summary: List files in a folder
      parameters:
        - { in: query, name: folderId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: search, schema: { type: string, maxLength: 120 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses: { '200': { $ref: '#/components/responses/Page' } }
  /documents/upload:
    post:
      summary: Upload a file (maximum 25 MB) to private workspace storage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [folderId, file]
              properties:
                folderId: { type: string, format: uuid }
                projectId: { type: string, format: uuid }
                projectName: { type: string, maxLength: 200 }
                proposalId: { type: string, format: uuid }
                file: { type: string, format: binary }
      responses: { '201': { description: Uploaded }, '400': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /documents/{documentId}:
    parameters:
      - { $ref: '#/components/parameters/DocumentId' }
    patch:
      summary: Rename, move, or relink a document
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentPatch' } } } }
      responses: { '200': { description: Updated }, '404': { $ref: '#/components/responses/Error' } }
    delete:
      summary: Permanently delete a stored document (owner/admin)
      responses: { '200': { description: Deleted }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /documents/{documentId}/download:
    parameters:
      - { $ref: '#/components/parameters/DocumentId' }
    get:
      summary: Create a private 60-second download URL
      responses: { '200': { description: Signed download URL }, '404': { $ref: '#/components/responses/Error' } }
  /invoices:
    get:
      summary: List workspace invoices, pro-formas, and quotes
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { in: query, name: type, schema: { type: string, enum: [invoice, pro_forma, quote] } }
        - { in: query, name: status, schema: { type: string, enum: [draft, pending, sent, accepted, partial, paid, overdue, void] } }
        - { in: query, name: search, schema: { type: string, maxLength: 120 } }
      responses: { '200': { $ref: '#/components/responses/Page' } }
    post:
      summary: Create an invoice with server-calculated totals
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceCreate' } } } }
      responses: { '201': { description: Invoice created }, '400': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /invoices/summary:
    get:
      summary: Total invoiced, collected, outstanding, and overdue invoice values
      responses: { '200': { description: Invoice summary } }
  /invoices/{invoiceId}:
    parameters:
      - { $ref: '#/components/parameters/InvoiceId' }
    get:
      summary: Get invoice preview with line items and payments
      responses: { '200': { description: Invoice details }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      summary: Update an unpaid, non-void invoice and atomically recalculate totals
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InvoicePatch' } } } }
      responses: { '200': { description: Updated }, '400': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
    delete:
      summary: Archive an unpaid invoice (owner/admin)
      responses: { '200': { description: Archived }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /invoices/{invoiceId}/status:
    parameters:
      - { $ref: '#/components/parameters/InvoiceId' }
    post:
      summary: Save draft, mark pending/sent/accepted, or void (void is owner/admin)
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [status], properties: { status: { type: string, enum: [draft, pending, sent, accepted, void] } } } } } }
      responses: { '200': { description: Status changed }, '409': { $ref: '#/components/responses/Error' } }
  /invoices/{invoiceId}/payments:
    parameters:
      - { $ref: '#/components/parameters/InvoiceId' }
    post:
      summary: Record a non-overpaying payment and update partial/paid status atomically
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentCreate' } } } }
      responses: { '201': { description: Payment recorded }, '400': { $ref: '#/components/responses/Error' } }
  /invoices/{invoiceId}/pdf:
    parameters:
      - { $ref: '#/components/parameters/InvoiceId' }
    get:
      summary: Download a generated invoice PDF
      responses:
        '200': { description: Invoice PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    supabaseCookie: { type: apiKey, in: cookie, name: sb-access-token }
  schemas:
    Email: { type: object, additionalProperties: false, required: [email], properties: { email: { type: string, format: email } } }
    Login:
      oneOf:
        - { type: object, additionalProperties: false, required: [email], properties: { email: { type: string, format: email } } }
        - { type: object, additionalProperties: false, required: [email, otp], properties: { email: { type: string, format: email }, otp: { type: string, pattern: '^\\d{6}$' } } }
        - { type: object, additionalProperties: false, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string } } }
    Register:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 128 }
        displayName: { type: string, maxLength: 120 }
        companyName: { type: string, maxLength: 160 }
    OnboardingPatch:
      type: object
      additionalProperties: false
      properties:
        currentStep: { type: string }
        completedSteps: { type: array, items: { type: string } }
        skippedSteps: { type: array, items: { type: string } }
        company:
          type: object
          additionalProperties: false
          properties:
            name: { type: string }
            logoUrl: { type: [string, 'null'], format: uri }
            website: { type: [string, 'null'], format: uri }
            businessEmail: { type: [string, 'null'], format: email }
            phone: { type: [string, 'null'] }
            address: { type: [string, 'null'] }
            country: { type: [string, 'null'] }
            currency: { type: string, pattern: '^[A-Z]{3}$' }
            taxId: { type: [string, 'null'] }
            timezone: { type: string }
    Envelope: { type: object, required: [data, requestId], properties: { data: {}, requestId: { type: string, format: uuid } } }
    Error: { type: object, required: [error], properties: { error: { type: object, required: [code, message, requestId], properties: { code: { type: string }, message: { type: string }, fields: { type: object }, requestId: { type: string } } } } }
    Page: { type: object, properties: { items: { type: array, items: {} }, page: { type: integer }, pageSize: { type: integer }, total: { type: integer }, hasMore: { type: boolean } } }
    ProjectStatus: { type: string, enum: [active, planning, in_progress, on_hold, completed] }
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [name, clientName, projectType]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        clientName: { type: string, minLength: 1, maxLength: 160 }
        projectType: { type: string, minLength: 1, maxLength: 80 }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        location: { type: string, maxLength: 240 }
        clientContact: { type: [string, 'null'], maxLength: 40 }
        clientEmail: { type: [string, 'null'], format: email }
        description: { type: [string, 'null'], maxLength: 5000 }
        areaSqft: { type: [number, 'null'], exclusiveMinimum: 0 }
        projectValue: { type: [number, 'null'], minimum: 0 }
        approvedBudget: { type: [number, 'null'], minimum: 0 }
        startDate: { type: [string, 'null'], format: date }
        targetCompletionDate: { type: [string, 'null'], format: date }
        assignedDesignerId: { type: [string, 'null'], format: uuid }
        tags: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
    ProjectPatch:
      description: Any non-empty allowlisted subset of ProjectCreate.
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        clientName: { type: string, minLength: 1, maxLength: 160 }
        projectType: { type: string, minLength: 1, maxLength: 80 }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        location: { type: string, maxLength: 240 }
        clientContact: { type: [string, 'null'], maxLength: 40 }
        clientEmail: { type: [string, 'null'], format: email }
        description: { type: [string, 'null'], maxLength: 5000 }
        areaSqft: { type: [number, 'null'], exclusiveMinimum: 0 }
        projectValue: { type: [number, 'null'], minimum: 0 }
        approvedBudget: { type: [number, 'null'], minimum: 0 }
        startDate: { type: [string, 'null'], format: date }
        targetCompletionDate: { type: [string, 'null'], format: date }
        assignedDesignerId: { type: [string, 'null'], format: uuid }
        tags: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
    ProjectRoom:
      type: object
      additionalProperties: false
      required: [name, roomType]
      properties:
        name: { type: string, maxLength: 120 }
        roomType: { type: string, maxLength: 80 }
        length: { type: [number, 'null'], exclusiveMinimum: 0 }
        width: { type: [number, 'null'], exclusiveMinimum: 0 }
        height: { type: [number, 'null'], exclusiveMinimum: 0 }
        unit: { type: string, enum: [ft, m], default: ft }
        notes: { type: [string, 'null'], maxLength: 2000 }
    ProjectImportUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, description: "CSV, XLS, or XLSX; maximum 10 MB and 5,000 data rows" }
        sheet: { type: string, description: Optional worksheet name; defaults to the first sheet }
    BoqImportUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, description: "CSV, XLS, or XLSX; maximum 10 MB and 10,000 data rows" }
        sheet: { type: string, description: Optional worksheet name; defaults to the first sheet }
        projectId: { type: string, format: uuid, description: Optional active project to link the imported BOQ to }
    ProposalStatus: { type: string, enum: [draft, sent, approved, revisions, won, lost] }
    ProposalCreate:
      type: object
      additionalProperties: false
      required: [projectName, clientName, proposedValue]
      properties:
        projectId: { type: [string, 'null'], format: uuid }
        projectName: { type: string, maxLength: 200 }
        clientName: { type: string, maxLength: 200 }
        sourceType: { type: string, enum: [scratch, boq, duplicate, template], default: scratch }
        sourceId: { type: [string, 'null'], format: uuid, description: Required unless sourceType is scratch }
        sourceLabel: { type: [string, 'null'], maxLength: 240 }
        proposedValue: { type: number, minimum: 0 }
        expiryDate: { type: [string, 'null'], format: date }
        internalNotes: { type: [string, 'null'], maxLength: 5000 }
        scopeItems: { type: array, maxItems: 100, items: { type: string, maxLength: 500 } }
    ProposalPatch:
      type: object
      additionalProperties: false
      properties:
        projectId: { type: [string, 'null'], format: uuid }
        projectName: { type: string, maxLength: 200 }
        clientName: { type: string, maxLength: 200 }
        proposedValue: { type: number, minimum: 0 }
        expiryDate: { type: [string, 'null'], format: date }
        internalNotes: { type: [string, 'null'], maxLength: 5000 }
        scopeItems: { type: array, maxItems: 100, items: { type: string, maxLength: 500 } }
    FolderCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 160 }
        parentId: { type: [string, 'null'], format: uuid }
    FolderPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 160 }
        parentId: { type: [string, 'null'], format: uuid }
    DocumentPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 255 }
        folderId: { type: string, format: uuid }
        projectId: { type: [string, 'null'], format: uuid }
        projectName: { type: [string, 'null'], maxLength: 200 }
    InvoiceItem:
      type: object
      additionalProperties: false
      required: [description, quantity, rate]
      properties:
        description: { type: string, maxLength: 500 }
        quantity: { type: number, exclusiveMinimum: 0 }
        rate: { type: number, minimum: 0 }
    BillingAddress:
      type: object
      additionalProperties: false
      required: [line1, city, state, pincode]
      properties:
        line1: { type: string, maxLength: 240 }
        line2: { type: [string, 'null'], maxLength: 240 }
        city: { type: string, maxLength: 120 }
        state: { type: string, maxLength: 120 }
        pincode: { type: string, maxLength: 20 }
    BankDetails:
      type: object
      additionalProperties: false
      required: [bankName, accountHolder, accountNumber, ifscCode]
      properties:
        bankName: { type: string, maxLength: 160 }
        accountHolder: { type: string, maxLength: 160 }
        accountNumber: { type: string, maxLength: 40 }
        ifscCode: { type: string, maxLength: 20 }
        branch: { type: [string, 'null'], maxLength: 160 }
        branchAddress: { type: [string, 'null'], maxLength: 300 }
    InvoiceCreate:
      type: object
      additionalProperties: false
      required: [type, clientName, billingAddress, projectName, issueDate, dueDate, milestone, items]
      properties:
        type: { type: string, enum: [invoice, pro_forma, quote] }
        invoiceNumber: { type: string, maxLength: 80, description: Optional workspace-unique manual number; otherwise a system code is generated }
        clientId: { type: [string, 'null'], format: uuid }
        clientName: { type: string, maxLength: 200 }
        billingAddress: { $ref: '#/components/schemas/BillingAddress' }
        projectId: { type: [string, 'null'], format: uuid }
        projectName: { type: string, maxLength: 200 }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        milestone: { type: string, maxLength: 200 }
        reference: { type: [string, 'null'], maxLength: 200 }
        taxRate: { type: number, minimum: 0, maximum: 100, default: 18 }
        additionalNotes: { type: [string, 'null'], maxLength: 5000 }
        bankDetails: { oneOf: [{ $ref: '#/components/schemas/BankDetails' }, { type: 'null' }] }
        status: { type: string, enum: [draft, pending], default: draft }
        items: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/InvoiceItem' } }
    InvoicePatch:
      type: object
      description: Any allowlisted subset of InvoiceCreate; totals and currency cannot be supplied.
      additionalProperties: false
      properties:
        type: { type: string, enum: [invoice, pro_forma, quote] }
        invoiceNumber: { type: string, maxLength: 80 }
        clientId: { type: [string, 'null'], format: uuid }
        clientName: { type: string, maxLength: 200 }
        billingAddress: { $ref: '#/components/schemas/BillingAddress' }
        projectId: { type: [string, 'null'], format: uuid }
        projectName: { type: string, maxLength: 200 }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        milestone: { type: string, maxLength: 200 }
        reference: { type: [string, 'null'], maxLength: 200 }
        taxRate: { type: number, minimum: 0, maximum: 100 }
        additionalNotes: { type: [string, 'null'], maxLength: 5000 }
        bankDetails: { oneOf: [{ $ref: '#/components/schemas/BankDetails' }, { type: 'null' }] }
        status: { type: string, enum: [draft, pending] }
        items: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/InvoiceItem' } }
    PaymentCreate:
      type: object
      additionalProperties: false
      required: [amount, method]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        paidAt: { type: string, format: date-time }
        method: { type: string, enum: [cash, bank_transfer, card, upi, cheque, other] }
        reference: { type: [string, 'null'], maxLength: 200 }
        notes: { type: [string, 'null'], maxLength: 1000 }
  parameters:
    ProjectId: { in: path, name: projectId, required: true, schema: { type: string, format: uuid } }
    RoomId: { in: path, name: roomId, required: true, schema: { type: string, format: uuid } }
    ProposalId: { in: path, name: proposalId, required: true, schema: { type: string, format: uuid } }
    FolderId: { in: path, name: folderId, required: true, schema: { type: string, format: uuid } }
    DocumentId: { in: path, name: documentId, required: true, schema: { type: string, format: uuid } }
    InvoiceId: { in: path, name: invoiceId, required: true, schema: { type: string, format: uuid } }
  responses:
    Error: { description: Error envelope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Page: { description: Paginated response, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
