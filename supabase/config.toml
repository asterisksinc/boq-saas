# Local Supabase Auth configuration. Hosted projects must use the same template
# bodies in Authentication > Email Templates; config.toml is not pushed to a
# hosted project by database migrations.
project_id = "boq-saas"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/onboarding", "http://localhost:3000/reset-password"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Your BOQ Design Arena verification code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your BOQ Design Arena login code"
content_path = "./supabase/templates/magic-link.html"
