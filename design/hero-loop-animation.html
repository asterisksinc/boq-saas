  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { overflow: hidden; background: #ffffff; }

  /* Stage keeps the image's 7680×4860 ratio and covers the viewport. */
  .stage {
    position: fixed;
    top: 50%;
    left: 50%;
    width: max(100vw, calc(100vh * 1.5802));
    aspect-ratio: 7680 / 4860;
    transform: translate(-50%, -50%);
  }

  .band {
    position: absolute;
    left: 0;
    width: 100%;
    overflow: hidden;
  }

  /* Each band is a slice of the same image; it stretches leftward from the right edge and eases back. */
  .art {
    position: absolute;
    left: 0;
    width: 100%;
    background: var(--img) center / 100% 100% no-repeat;
    transform-origin: 100% 50%;
    animation: reach var(--duration) ease-in-out infinite alternate;
    animation-delay: calc(var(--i) * -0.5s);
    will-change: transform;
  }

  @keyframes reach {
    0%   { transform: scaleX(1); filter: brightness(1); }
    100% { transform: scaleX(var(--stretch)); filter: brightness(1.06); }
  }

  /* Soft light sweep across the bands. */
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,0.18) 50%, transparent 65%);
    background-size: 250% 100%;
    animation: sweep calc(var(--duration) * 2) linear infinite;
    mix-blend-mode: screen;
    pointer-events: none;
  }

  @keyframes sweep {
    from { background-position: 150% 0; }
    to   { background-position: -100% 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .art, .stage::after { animation: none; }
  }
</style>
